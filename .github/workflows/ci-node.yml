name: ci-node

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-node:
    name: test-node
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --package-lock=false
      - run: npm run lint
      - run: npm run test
      - run: npm run build
