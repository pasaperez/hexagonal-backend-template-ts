name: ci-bun

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-bun:
    name: test-bun
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - run: bun run build
